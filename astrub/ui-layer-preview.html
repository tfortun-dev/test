<!doctype html><html lang="fr"><meta charset="utf-8"><title>Astrub — éléments de la DA</title><style>body{background:#27303c;color:white;font:16px Arial;padding:25px}section{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:15px 0}figure{background:#394351;border:1px solid #738091;border-radius:12px;margin:0;padding:12px;display:grid;place-items:center}img{width:100%;max-height:170px;object-fit:contain}figcaption{font-size:11px;margin-top:8px}h1{font-size:25px}</style><h1>Astrub — composants séparés</h1><p>Textures sans texte, icônes, cadres et jauges.</p><div id="layers"></div><script>for(const row of [['button-green','button-orange','button-blue','button-red','button-gold','button-taupe'],['panel-dark','panel-paper','meter-track','meter-green','meter-gold','meter-purple'],['icon-coin','icon-logs','icon-crystal','icon-swords','icon-hammer','icon-gear'],['icon-collect','icon-move','icon-upgrade','icon-info','icon-house','icon-map']])document.querySelector('#layers').insertAdjacentHTML('beforeend','<section>'+row.map(n=>'<figure><img src="/assets/ui-layered/'+n+'.png" alt="'+n+'"><figcaption>'+n+'</figcaption></figure>').join('')+'</section>');</script></html>
